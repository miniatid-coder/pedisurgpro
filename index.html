// ============================================================================
// CLINICAL TOOLS - Complete code from Paul
// ============================================================================
const ML_PER_OZ = 30;
const DAYS_PER_MONTH = 30.4375;
const DAYS_PER_YEAR = 365.25;

function num(v){ const n = parseFloat(v); return isFinite(n) ? n : null; }
function fmt(n, dp){
  if(n===null || n===undefined || !isFinite(n)) return "—";
  const s = n.toFixed(dp===undefined?1:dp);
  return s.replace(/\.0+$/,"").replace(/(\.\d*?)0+$/,"$1");
}
function ageDays(val, unit){
  const n = num(val);
  if(n===null || n<0) return null;
  if(unit==="days") return n;
  if(unit==="months") return n*DAYS_PER_MONTH;
  return n*DAYS_PER_YEAR;
}
function cgaWeeks(ga, days){
  const g = num(ga);
  if(g===null || days===null) return null;
  return g + days/7;
}
function ageLabel(days){
  if(days===null) return "—";
  if(days < 60) return fmt(days,0)+" days";
  if(days < 730) return fmt(days/DAYS_PER_MONTH,1)+" months";
  return fmt(days/DAYS_PER_YEAR,1)+" years";
}

function hsRate(w){ if(w<=10) return w*4; if(w<=20) return 40 + (w-10)*2; return 60 + (w-20)*1; }
function hsDaily(w){ if(w<=10) return w*100; if(w<=20) return 1000 + (w-10)*50; return 1500 + (w-20)*20; }

function feedGoal(days, w){
  if(days===null) return null;
  const mo = days/DAYS_PER_MONTH, y = days/DAYS_PER_YEAR;
  if(mo < 6) return {band:"0–6 months", loV:150, hiV:180};
  if(mo < 12) return {band:"6–12 months", loV:100, hiV:120};
  if(y <= 3) return {band:"1–3 years", holliday:true, loK:75, hiK:90};
  return {band:"over 3 years", none:true};
}

  if(days===null) return null;
  if(days <= 28) return preterm ? "preterm" : "term";
  if(days/DAYS_PER_MONTH < 12) return "infant";
  return "child";
}

    <div style={{marginBottom:10}}>

}

function Tools({onHome,settings,pageRef}){
  const [open,setOpen] = useState(null);
  const [weight,setWeight] = useState("");
  const [ageVal,setAgeVal] = useState("");
  const [ageUnit,setAgeUnit] = useState("years");
  const [preterm,setPreterm] = useState(false);
  const [ga,setGa] = useState("");
  const [showMath,setShowMath] = useState(true);
  const [ctxOpen,setCtxOpen] = useState(true);
  const [resetSeq,setResetSeq] = useState(0);

  useEffect(() => {
    if (pageRef && pageRef.current) pageRef.current.scrollTop = 0;
  }, [open, pageRef]);

  const days = ageDays(ageVal, ageUnit);
  const ctx = {weight:num(weight), days, preterm, ga:num(ga), cga:preterm?cgaWeeks(ga,days):null};

  function clearAll(){
    setWeight(""); setAgeVal(""); setAgeUnit("years"); setPreterm(false); setGa("");
    setResetSeq(n=>n+1);
  }

  const visibleTools = TOOL_LIST.filter(t=>settings.tools[t.id]);
  const tool = TOOL_LIST.find(t=>t.id===open);
  const body = !tool ? null
    : tool.id==="io" ? <ToolIO ctx={ctx} showMath={showMath}/>
    : tool.id==="feeds" ? <ToolFeeds ctx={ctx} showMath={showMath}/>
    : tool.id==="mivf" ? <ToolMIVF ctx={ctx} showMath={showMath}/>
    : tool.id==="bv" ? <ToolBV ctx={ctx} showMath={showMath}/>
    : tool.id==="la" ? <ToolLA ctx={ctx} showMath={showMath}/>
    : tool.id==="pas" ? <ToolPAS/>
    : tool.id==="alv" ? <ToolAlvarado/>
    : tool.id==="sipa" ? <ToolSIPA ctx={ctx} showMath={showMath}/>
    : tool.id==="vitals"? <ToolVitals ctx={ctx}/>
    : tool.id==="sizes" ? <ToolSizes ctx={ctx}/>
    : tool.id==="parc" ? <ToolPARC ctx={ctx} showMath={showMath}/>
    : tool.id==="burn" ? <ToolBurn ctx={ctx} showMath={showMath}/>
    : tool.id==="sbs" ? <ToolShortBowel ctx={ctx} showMath={showMath}/>
    : tool.id==="peld" ? <ToolPELD ctx={ctx} showMath={showMath}/>
    : null;

  const hasCtx = ctx.weight!==null || days!==null;

  return (
    <div>
      <button style={C.back("#00e696")} onClick={()=>{ if(tool){setOpen(null);} else {clearAll(); onHome();} }}>
        {tool ? "← All Tools" : "← Home"}
      </button>

      <div style={{fontSize:24,fontWeight:800,marginBottom:2}}>🧮 Clinical Tools</div>
      <div style={{fontSize:13,color:"#607090",marginBottom:14}}>
        {tool ? tool.name : "Enter the patient once — every tool uses it"}
      </div>

      <div style={{background:"rgba(77,184,255,0.07)",border:"1px solid rgba(77,184,255,0.28)",borderRadius:14,padding:"13px 14px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setCtxOpen(!ctxOpen)}>
          <div>
            <div style={{fontSize:12,fontWeight:800,color:"#4db8ff",letterSpacing:1,textTransform:"uppercase"}}>Patient</div>
            {!ctxOpen && (
              <div style={{fontSize:12,color:"#a0b0d0",marginTop:3}}>
                {ctx.weight!==null?fmt(ctx.weight,2)+" kg":"no weight"} · {days!==null?ageLabel(days):"no age"}
                {preterm&&ctx.cga?` · CGA ${fmt(ctx.cga,1)} wk`:""}
              </div>
            )}
          </div>
          <span style={{color:"#4db8ff",fontSize:13}}>{ctxOpen?"▲":"▼"}</span>
        </div>

        {ctxOpen && (
          <div style={{marginTop:12}}>
            <NumIn label="Weight" value={weight} onChange={setWeight} unit="kg" placeholder="e.g. 12.4"/>
            <div style={{fontSize:11,fontWeight:700,color:"#8090b0",marginBottom:4}}>Age</div>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
              <input type="number" inputMode="decimal" value={ageVal} placeholder="e.g. 3"
                onChange={e=>setAgeVal(e.target.value)} style={{...C.inp,marginBottom:0,flex:1,fontSize:16}}/>
              <div style={{display:"flex",gap:5}}>
                {["days","months","years"].map(u=>(
                  <button key={u} style={{...C.chip(u===ageUnit,"#4db8ff"),padding:"5px 9px"}} onClick={()=>setAgeUnit(u)}>{u}</button>
                ))}
              </div>
            </div>

            <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:preterm?10:4,cursor:"pointer"}} onClick={()=>setPreterm(!preterm)}>
              <div style={{width:19,height:19,borderRadius:5,border:"1px solid "+(preterm?"#4db8ff":"rgba(255,255,255,0.25)"),background:preterm?"#4db8ff":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"#000",flexShrink:0}}>{preterm?"✓":""}</div>
              <span style={{fontSize:12.5,color:"#e8f0fe"}}>Born preterm</span>
            </div>
            {preterm && (
              <div>
                <NumIn label="Gestational age at birth" value={ga} onChange={setGa} unit="weeks" placeholder="e.g. 29"/>
                {ctx.cga!==null && <div style={{fontSize:12,color:"#4db8ff",marginTop:-4,marginBottom:8}}>Corrected gestational age: {fmt(ctx.cga,1)} weeks</div>}
              </div>
            )}

            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button onClick={clearAll} style={{flex:1,background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.3)",borderRadius:11,padding:"9px",fontSize:12,fontWeight:700,color:"#ff9090",cursor:"pointer",fontFamily:"inherit"}}>Clear</button>
              <button onClick={()=>setShowMath(!showMath)} style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:11,padding:"9px",fontSize:12,fontWeight:600,color:"#a0b0d0",cursor:"pointer",fontFamily:"inherit"}}>
                {showMath?"Hide working":"Show working"}
              </button>
            </div>
            <div style={{fontSize:10,color:"#506070",marginTop:9,lineHeight:1.6}}>
              No patient information is saved. It is held only while this screen is open and is erased by Clear or by going back to Home.
            </div>
          </div>
        )}
      </div>

      {!tool ? (
        <div>
          {TOOL_GROUPS.map(g => {
            const inGroup = visibleTools.filter(t => t.grp === g);
            if(inGroup.length === 0) return null;
            return (
              <div key={g}>
                <div style={{...C.lbl,marginTop:14}}>{g}</div>
                {inGroup.map(t=>(
                  <div key={t.id} onClick={()=>setOpen(t.id)}
                    style={{...C.card,display:"flex",alignItems:"center",gap:13,background:t.cl+"0d",border:"1px solid "+t.cl+"33"}}>
                    <div style={{width:44,height:44,borderRadius:12,background:t.cl+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{t.icon}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13.5,fontWeight:700,color:t.cl,marginBottom:2}}>{t.name}</div>
                      <div style={{fontSize:11,color:"#8090b0",lineHeight:1.45}}>{t.sub}</div>
                    </div>
                    <span style={{color:t.cl,fontSize:16,flexShrink:0}}>›</span>
                  </div>
                ))}
              </div>
            );
          })}
          {!hasCtx && (
            <div style={{fontSize:11,color:"#607090",textAlign:"center",lineHeight:1.7,marginTop:12,padding:"0 10px"}}>
              Tools that need a weight or age will tell you what is missing.
            </div>
          )}
          <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:13,padding:"13px 14px",marginTop:14}}>
            <div style={{fontSize:11,color:"#8090b0",lineHeight:1.75}}>
              These tools are calculation aids. Each one shows its formula and its source so it can be checked. They do not replace clinical judgement.
            </div>
          </div>
        </div>
      ) : (
        <div>
          <div style={{width:44,height:44,borderRadius:12,background:tool.cl+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,marginBottom:12}}>{tool.icon}</div>
          <div key={resetSeq}>{body}</div>
        </div>
      )}
    </div>
  );
}

}

function Societies({onHome}) {
  return (
    <div>
      <button style={C.back()} onClick={onHome}>← Home</button>
      <div style={{fontSize:24,fontWeight:800,marginBottom:2}}>🏛️ Societies</div>
      <div style={{fontSize:13,color:"#607090",marginBottom:14}}>Pediatric surgery organizations worldwide</div>
      {SOCIETIES.map((s,i)=>(
        <a key={i} href={s.url} target="_blank" rel="noreferrer" style={{...C.card,display:"flex",alignItems:"center",gap:13,textDecoration:"none",color:"inherit",background:s.color+"0d",border:"1px solid "+s.color+"33"}}>
          <div style={{width:46,height:46,borderRadius:12,background:s.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:s.color,flexShrink:0}}>{s.name}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:s.color,marginBottom:2}}>{s.name}</div>
            <div style={{fontSize:11,color:"#e8f0fe",marginBottom:3,lineHeight:1.4}}>{s.full}</div>
            <div style={{fontSize:10,color:"#607090"}}>{s.region}</div>
          </div>
          <span style={{color:s.color,fontSize:16,flexShrink:0}}>↗</span>
        </a>
      ))}
    </div>
  );
}

      <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>Virtual Pedi Surgeon</div>

        <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:13,fontWeight:700,color:"#8b6dd4"}}>Pedi Surgery in the News</div><div style={{fontSize:10,color:"#a0b0d0"}}>Tap to learn more</div></div>

        <div style={{fontSize:18,color:"#6ba3d4",flexShrink:0}}>●</div>
        <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:13,fontWeight:700,color:"#6ba3d4"}}>JPS — Latest Articles</div><div style={{fontSize:11,color:"#a0b0d0"}}>Journal of Pediatric Surgery</div></div>
      </a>
      <a href="https://www.apsapedsurg.org" target="_blank" rel="noopener noreferrer" style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 14px",marginBottom:10,borderRadius:13,background:"rgba(200,140,100,0.08)",border:"1px solid rgba(200,140,100,0.4)",cursor:"pointer",textDecoration:"none",color:"inherit",transition:"0.2s"}}>
        <div style={{fontSize:18,color:"#d4ab6b",flexShrink:0}}>●</div>
        <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:13,fontWeight:700,color:"#d4ab6b"}}>APSA News</div><div style={{fontSize:11,color:"#a0b0d0"}}>Latest from apsapedsurg.org</div></div>
      </a>
      <a href="https://www.youtube.com/@PedSurgTV" target="_blank" rel="noopener noreferrer" style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 14px",marginBottom:10,borderRadius:13,background:"rgba(200,80,80,0.08)",border:"1px solid rgba(200,80,80,0.4)",cursor:"pointer",textDecoration:"none",color:"inherit",transition:"0.2s",textAlign:"left"}}>
        <div style={{fontSize:18,color:"#ff6b6b",flexShrink:0}}>●</div>
        <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:13,fontWeight:700,color:"#ff6b6b"}}>PedSurgTV — Latest Videos</div><div style={{fontSize:11,color:"#a0b0d0"}}>Newest uploads</div></div>
      </a>

      <div style={{height:80}}></div>

      {showComingSoon && (
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}}>
          <div style={{background:"rgba(15,25,45,0.95)",border:"1px solid rgba(120,100,200,0.4)",borderRadius:16,padding:40,maxWidth:500,textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:20}}>🚧</div>
            <div style={{fontSize:24,fontWeight:700,color:"#a64ff0",marginBottom:16}}>Coming Soon</div>
            <div style={{fontSize:14,color:"#a0b0d0",lineHeight:1.6,marginBottom:32}}>Pedi Surgery in the News will surface the latest publications, videos, and updates from across the pediatric surgery world — updated monthly.</div>
            <button onClick={()=>setShowComingSoon(false)} style={{background:"#a64ff0",border:"none",borderRadius:8,padding:"12px 32px",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",transition:"0.2s"}}>Dismiss</button>
          </div>
        </div>

}

function Settings({onHome,settings,onSettingsChange}) {
  const [expandedSections, setExpandedSections] = useState({home: true, nav: false, tools: false, nat: false, videos: false, podcasts: false});
  
  const updateHome = (key,val) => {
    onSettingsChange({...settings, home:{...settings.home,[key]:val}});
  };
  const updateTool = (id,val) => {
    onSettingsChange({...settings, clinicalTools:{...settings.clinicalTools,[id]:val}});
  };
  const updateNat = (key,val) => {
    const natToggles = settings.natTopics || {};
    onSettingsChange({...settings, natTopics:{...natToggles,[key]:val}});
  };
  const updateVideoSrc = (key,val) => {
    const videoToggles = settings.videoSources || {};
    onSettingsChange({...settings, videoSources:{...videoToggles,[key]:val}});
  };
  const updatePodcast = (key,val) => {
    const podToggles = settings.podcasts || {};
    onSettingsChange({...settings, podcasts:{...podToggles,[key]:val}});
  };

  const toggleSection = (section) => {
    setExpandedSections({...expandedSections, [section]: !expandedSections[section]});
  };

  const natTopics = settings.natTopics || Object.fromEntries(NAT.map(n => [n.title, true]));
  const videoSrcs = settings.videoSources || Object.fromEntries(VIDEO_SOURCES.map(v => [v.name, true]));
  const podToggles = settings.podcasts || Object.fromEntries(PODS.map(p => [p.title, true]));

  const Toggle = ({on, onClick}) => (
    <div onClick={onClick} style={{width:44,height:26,borderRadius:13,background:on?"#00e696":"rgba(255,255,255,0.1)",cursor:"pointer",position:"relative",transition:"background 0.2s",border:"none",padding:0,display:"flex",alignItems:"center",flexShrink:0}}>
      <div style={{width:22,height:22,borderRadius:11,background:"#fff",position:"absolute",left:on?20:2,transition:"left 0.2s",boxShadow:"0 2px 4px rgba(0,0,0,0.3)"}}></div>
    </div>
  );

  const formatLabel = (key) => {
    const labels = {
      apsaWebsite: "APSA Website",
      apsaNat: "APSA NaT",
      forFamilies: "For Families",
      societies: "Societies",
      socialMedia: "Social Media",
      virtualPediSurgeon: "Virtual Pedi Surgeon",
      surgeryVideos: "Surgery Videos",
      podcasts: "Podcasts",
      openEvidence: "OpenEvidence",
      research: "PubMed & Journals",
      expertCme: "ExPERT CME",
      whatsNew: "What's New",
      liveFeeds: "Live Feeds",
      clinicalTools: "Clinical Tools"
    };
    return labels[key] || key.replace(/([A-Z])/g, ' $1').trim();
  };

  const sectionStyle = (bgColor) => ({background:bgColor,border:"1px solid rgba(255,255,255,0.15)",borderRadius:12,padding:"13px 14px",marginBottom:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"});
  const expandedStyle = {background:"rgba(77,184,255,0.1)",borderTop:"2px solid rgba(77,184,255,0.5)"};

  return (
    <div>
      <button style={C.back()} onClick={onHome}>← Home</button>
      <div style={{fontSize:24,fontWeight:800,marginBottom:2}}>⚙️ Settings</div>
      <div style={{fontSize:13,color:"#607090",marginBottom:16}}>Hide anything you don't use</div>

      {/* HOME SCREEN */}
      <div style={{...sectionStyle("rgba(77,184,255,0.08)"), ...(expandedSections.home ? expandedStyle : {})}} onClick={()=>toggleSection("home")}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:16}}>🏠</span>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#4db8ff"}}>Home screen</div>
            <div style={{fontSize:10,color:"#a0b0d0"}}>All 14 buttons</div>
          </div>
        </div>
        <div style={{fontSize:14,color:"#4db8ff"}}>{expandedSections.home ? "▲" : "▼"}</div>
      </div>
      {expandedSections.home && (
        <div style={{background:"rgba(77,184,255,0.04)",border:"1px solid rgba(77,184,255,0.2)",borderRadius:12,padding:12,marginBottom:10}}>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <button onClick={()=>Object.keys(settings.home).forEach(k=>updateHome(k,true))} style={{...C.chip(true,"#4db8ff"),flex:1}}>Show all</button>
            <button onClick={()=>Object.keys(settings.home).forEach(k=>updateHome(k,false))} style={{...C.chip(false,"#4db8ff"),flex:1}}>Hide all</button>
          </div>
          {Object.keys(settings.home).map(k=>(
            <div key={k} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:9,marginBottom:12,cursor:"pointer"}}>
              <span style={{fontSize:12,color:settings.home[k]?"#e8f0fe":"#a0b0d0"}}>{formatLabel(k)}</span>
              <Toggle on={settings.home[k]} onClick={()=>updateHome(k,!settings.home[k])} />
            </div>
          ))}
        </div>
      )}

      {/* NAVIGATION TABS */}
      <div style={{...sectionStyle("rgba(150,100,200,0.08)"), ...(expandedSections.nav ? expandedStyle : {})}} onClick={()=>toggleSection("nav")}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:16}}>📑</span>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#a064ff"}}>Navigation tabs</div>
            <div style={{fontSize:10,color:"#a0b0d0"}}>All 7 shown</div>
          </div>
        </div>
        <div style={{fontSize:14,color:"#a064ff"}}>{expandedSections.nav ? "▲" : "▼"}</div>
      </div>

      {/* CLINICAL TOOLS */}
      <div style={{...sectionStyle("rgba(0,230,150,0.08)"), ...(expandedSections.tools ? expandedStyle : {})}} onClick={()=>toggleSection("tools")}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:16}}>🧮</span>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#00e696"}}>Clinical tools</div>
            <div style={{fontSize:10,color:"#a0b0d0"}}>All 14 shown</div>
          </div>
        </div>
        <div style={{fontSize:14,color:"#00e696"}}>{expandedSections.tools ? "▲" : "▼"}</div>
      </div>
      {expandedSections.tools && (
        <div style={{background:"rgba(0,230,150,0.04)",border:"1px solid rgba(0,230,150,0.2)",borderRadius:12,padding:12,marginBottom:10}}>
          {TOOL_LIST.map(t=>(
            <div key={t.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:9,marginBottom:12,cursor:"pointer"}}>
              <span style={{fontSize:12,color:"#00e696"}}>{t.name}</span>
              <Toggle on={settings.clinicalTools[t.name]} onClick={()=>updateTool(t.name,!settings.clinicalTools[t.name])} />
            </div>
          ))}
        </div>
      )}

      {/* NAT CATEGORIES */}
      <div style={{...sectionStyle("rgba(77,184,255,0.08)"), ...(expandedSections.nat ? expandedStyle : {})}} onClick={()=>toggleSection("nat")}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:16}}>📖</span>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#4db8ff"}}>NaT categories</div>
            <div style={{fontSize:10,color:"#a0b0d0"}}>All 18 shown</div>
          </div>
        </div>
        <div style={{fontSize:14,color:"#4db8ff"}}>{expandedSections.nat ? "▲" : "▼"}</div>
      </div>
      {expandedSections.nat && (
        <div style={{background:"rgba(77,184,255,0.04)",border:"1px solid rgba(77,184,255,0.2)",borderRadius:12,padding:12,marginBottom:10}}>
          {NAT.map(n=>(
            <div key={n.title} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:9,marginBottom:12,cursor:"pointer"}}>
              <span style={{fontSize:12,color:natTopics[n.title]?"#e8f0fe":"#a0b0d0"}}>{n.title}</span>
              <Toggle on={natTopics[n.title]} onClick={()=>updateNat(n.title,!natTopics[n.title])} />
            </div>
          ))}
        </div>
      )}

      {/* VIDEO SOURCES */}
      <div style={{...sectionStyle("rgba(77,184,255,0.08)"), ...(expandedSections.videos ? expandedStyle : {})}} onClick={()=>toggleSection("videos")}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:16}}>▶️</span>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#4db8ff"}}>Video sources</div>
            <div style={{fontSize:10,color:"#a0b0d0"}}>All 9 shown</div>
          </div>
        </div>
        <div style={{fontSize:14,color:"#4db8ff"}}>{expandedSections.videos ? "▲" : "▼"}</div>
      </div>
      {expandedSections.videos && (
        <div style={{background:"rgba(77,184,255,0.04)",border:"1px solid rgba(77,184,255,0.2)",borderRadius:12,padding:12,marginBottom:10}}>
          {VIDEO_SOURCES.map(v=>(
            <div key={v.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:9,marginBottom:12,cursor:"pointer"}}>
              <span style={{fontSize:12,color:videoSrcs[v.name]?"#e8f0fe":"#a0b0d0"}}>{v.name}</span>
              <Toggle on={videoSrcs[v.name]} onClick={()=>updateVideoSrc(v.name,!videoSrcs[v.name])} />
            </div>
          ))}
        </div>
      )}

      {/* PODCASTS */}
      <div style={{...sectionStyle("rgba(160,100,255,0.08)"), ...(expandedSections.podcasts ? expandedStyle : {})}} onClick={()=>toggleSection("podcasts")}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:16}}>🎙️</span>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#a064ff"}}>Podcasts</div>
            <div style={{fontSize:10,color:"#a0b0d0"}}>All 6 shown</div>
          </div>
        </div>
        <div style={{fontSize:14,color:"#a064ff"}}>{expandedSections.podcasts ? "▲" : "▼"}</div>
      </div>
      {expandedSections.podcasts && (
        <div style={{background:"rgba(160,100,255,0.04)",border:"1px solid rgba(160,100,255,0.2)",borderRadius:12,padding:12,marginBottom:10}}>
          {PODS.map(p=>(
            <div key={p.title} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:9,marginBottom:12,cursor:"pointer"}}>
              <span style={{fontSize:12,color:podToggles[p.title]?"#e8f0fe":"#a0b0d0"}}>{p.title}</span>
              <Toggle on={podToggles[p.title]} onClick={()=>updatePodcast(p.title,!podToggles[p.title])} />
            </div>
          ))}
        </div>
      )}

      <div style={{height:80}}></div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const pageRef = useRef(null);
  const [settings, setSettings] = useState(() => {
    const saved = localStorage.getItem("pedsurgpro_settings");
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  });

  useEffect(() => {
    localStorage.setItem("pedsurgpro_settings", JSON.stringify(settings));
  }, [settings]);

  useEffect(() => {
    if (pageRef.current) pageRef.current.scrollTop = 0;
  }, [page]);

  return (
    <div style={C.app}>
      <div style={C.page} ref={pageRef}>
        {page === "home" && <Home onNav={setPage} settings={settings} />}
        {page === "nat" && <Nat onHome={() => setPage("home")} />}
        {page === "videos" && <Videos onHome={() => setPage("home")} />}
        {page === "podcasts" && <Podcasts onHome={() => setPage("home")} />}
        {page === "research" && <Research onHome={() => setPage("home")} />}
        {page === "social" && <SocialMedia onHome={() => setPage("home")} />}
        {page === "societies" && <Societies onHome={() => setPage("home")} />}
        {page === "tools" && <Tools onHome={() => setPage("home")} settings={settings} pageRef={pageRef} />}
        {page === "ai" && <AI onHome={() => setPage("home")} />}
        {page === "settings" && <Settings onHome={() => setPage("home")} settings={settings} onSettingsChange={setSettings} />}
      </div>

      <div style={C.nav}>
        <button style={C.nb(page === "home")} onClick={() => setPage("home")}>🏠<div style={{fontSize:9}}>Home</div></button>
        <button style={C.nb(page === "nat")} onClick={() => setPage("nat")}>📖<div style={{fontSize:9}}>NaT</div></button>
        <button style={C.nb(page === "videos")} onClick={() => setPage("videos")}>▶️<div style={{fontSize:9}}>Videos</div></button>
        <button style={C.nb(page === "podcasts")} onClick={() => setPage("podcasts")}>🎙️<div style={{fontSize:9}}>Podcasts</div></button>
        <button style={C.nb(page === "research")} onClick={() => setPage("research")}>🔬<div style={{fontSize:9}}>Research</div></button>
        <button style={C.nb(page === "societies")} onClick={() => setPage("societies")}>🏛️<div style={{fontSize:9}}>Societies</div></button>
        <button style={C.nb(page === "social")} onClick={() => setPage("social")}>📱<div style={{fontSize:9}}>Social</div></button>
        <button style={C.nb(page === "ai")} onClick={() => setPage("ai")}>✦<div style={{fontSize:9}}>Virt Surg</div></button>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
