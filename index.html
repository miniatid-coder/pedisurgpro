// ============= CLINICAL TOOLS FUNCTIONS =============

function calculateFluidNeeds(weightKg, uopTarget=1) {
  if (!weightKg) return null;
  return {
    uop: (weightKg * uopTarget).toFixed(1),
    ostomy: "0.5–1 × daily losses",
    ng: "0.5–1 × daily losses",
    feedVolume: (weightKg * 150).toFixed(0),
  };
}

function calculateEnteralFeeding(weightKg, feedStrength=100, feedRate=20) {
  if (!weightKg) return null;
  const volume = Math.round(weightKg * feedRate);
  const kcalPerMl = feedStrength / 100 * 1;
  const totalKcal = Math.round(volume * kcalPerMl * 24);
  return {
    volume: volume,
    kcalPerMl: kcalPerMl.toFixed(2),
    totalDailyKcal: totalKcal,
    feedStrength: feedStrength,
  };
}

function calculateMaintenanceIVFluid(weightKg) {
  if (!weightKg) return null;
  let mlPerKg = 0;
  if (weightKg <= 10) mlPerKg = weightKg * 4;
  else if (weightKg <= 20) mlPerKg = 40 + (weightKg - 10) * 2;
  else mlPerKg = 60 + (weightKg - 20) * 1;
  return {
    totalDaily: mlPerKg.toFixed(0),
    hourly: (mlPerKg / 24).toFixed(1),
    formula: "4-2-1: 4 mL/kg for first 10 kg + 2 mL/kg for next 10 kg + 1 mL/kg for >20 kg",
  };
}

function calculateBloodVolume(weightKg, ageYears) {
  if (!weightKg) return null;
  let bvPercent = ageYears < 1 ? 90 : 80;
  let totalBV = weightKg * bvPercent;
  return {
    totalVolume: totalBV.toFixed(0),
    unit: "mL (assume 80-90 mL/kg)",
    max15PercentEBL: (totalBV * 0.15).toFixed(0),
    max25PercentEBL: (totalBV * 0.25).toFixed(0),
    note: ageYears < 1 ? "Infants: 90 mL/kg" : "Children: 80 mL/kg",
  };
}

function calculateLocalAnesthetic(weightKg, agent="lidocaine") {
  if (!weightKg) return null;
  const limits = {
    lidocaine: {mg: 4.5, mL: 0.5, concentration: "1%"},
    lidocaineWithEpi: {mg: 7, mL: 0.7, concentration: "1%"},
    bupivacaine: {mg: 2.5, mL: 0.25, concentration: "0.5%"},
  };
  const limit = limits[agent] || limits.lidocaine;
  return {
    maxMg: (weightKg * limit.mg).toFixed(1),
    maxMl: (weightKg * limit.mL).toFixed(2),
    agent: agent,
    concentration: limit.concentration,
  };
}

function calculatePAS(symptoms) {
  const score = Object.values(symptoms).reduce((a, b) => a + (b ? 1 : 0), 0);
  let risk = "";
  if (score <= 4) risk = "Low risk (~1%)";
  else if (score <= 6) risk = "Intermediate risk (~20-30%)";
  else risk = "High risk (~90%+)";
  return { score, risk, maxScore: 10 };
}

function calculateAlvarado(symptoms) {
  const scores = {
    rbq: symptoms.rbq ? 1 : 0,
    nausea: symptoms.nausea ? 1 : 0,
    anorexia: symptoms.anorexia ? 1 : 0,
    rfd: symptoms.rfd ? 1 : 0,
    temp: symptoms.temp ? 1 : 0,
    fsh: symptoms.fsh ? 2 : 0,
    lcShift: symptoms.lcShift ? 1 : 0,
    wbc: symptoms.wbc ? 2 : 0,
  };
  const score = Object.values(scores).reduce((a, b) => a + b, 0);
  let risk = "";
  if (score < 5) risk = "Low risk";
  else if (score < 7) risk = "Intermediate risk";
  else risk = "High risk";
  return { score, risk, maxScore: 10 };
}

function calculateShockIndex(hr, sbp, ageYears) {
  if (!hr || !sbp) return null;
  const si = hr / sbp;
  const ageGroups = {
    "4-5": {normal: 1.1, high: 1.3},
    "6-12": {normal: 1.05, high: 1.25},
    "13-16": {normal: 0.9, high: 1.1},
  };
  let ageKey = "6-12";
  if (ageYears >= 4 && ageYears <= 5) ageKey = "4-5";
  else if (ageYears >= 13 && ageYears <= 16) ageKey = "13-16";
  const normal = ageGroups[ageKey].normal;
  let status = si <= normal ? "Normal" : "Elevated";
  return { si: si.toFixed(2), status, normal: normal.toFixed(2) };
}

function getVitalSignsByAge(ageYears) {
  if (!ageYears) return null;
  let vitals = {};
  if (ageYears < 1) {
    vitals = { hr: "100-160", rr: "30-60", map: "50-70", hypotension: "<50" };
  } else if (ageYears < 3) {
    vitals = { hr: "90-150", rr: "25-40", map: "55-75", hypotension: "<55" };
  } else if (ageYears < 6) {
    vitals = { hr: "80-120", rr: "20-30", map: "60-75", hypotension: "<60" };
  } else if (ageYears < 12) {
    vitals = { hr: "70-110", rr: "18-25", map: "65-80", hypotension: "<65" };
  } else {
    vitals = { hr: "60-100", rr: "12-16", map: "70-90", hypotension: "<70" };
  }
  return vitals;
}

function getAirwayTubeSizes(ageYears, weightKg) {
  if (!ageYears && !weightKg) return null;
  let sizes = {};
  if (ageYears < 1 || (weightKg && weightKg < 4)) {
    sizes = {ett: "3.0-3.5", laryngoscope: "1", ng: "8-10 Fr", chestTube: "10-14 Fr"};
  } else if (ageYears < 3 || (weightKg && weightKg < 13)) {
    sizes = {ett: "4.0-4.5", laryngoscope: "1-2", ng: "10-12 Fr", chestTube: "14-18 Fr"};
  } else if (ageYears < 8 || (weightKg && weightKg < 25)) {
    sizes = {ett: "5.0-5.5", laryngoscope: "2", ng: "12-14 Fr", chestTube: "18-24 Fr"};
  } else if (ageYears < 12 || (weightKg && weightKg < 40)) {
    sizes = {ett: "6.0-6.5", laryngoscope: "2-3", ng: "14-16 Fr", chestTube: "24-28 Fr"};
  } else {
    sizes = {ett: "7.0-8.0", laryngoscope: "3", ng: "16-18 Fr", chestTube: "28-32 Fr"};
  }
  return sizes;
}

function calculatePARC(risk) {
  if (!risk) return null;
  const scores = {
    fever: risk.fever ? 0.51 : 0,
    cough: risk.cough ? 0.29 : 0,
    diarrhea: risk.diarrhea ? 0.33 : 0,
    nausea: risk.nausea ? 0.22 : 0,
    anorexia: risk.anorexia ? 0.26 : 0,
    abd: risk.abd ? 1.15 : 0,
    rec: risk.rec ? 0.72 : 0,
  };
  const totalScore = Object.values(scores).reduce((a, b) => a + b, 0);
  const prob = 1 / (1 + Math.exp(-totalScore));
  return { probability: (prob * 100).toFixed(1), score: totalScore.toFixed(2) };
}

function calculateBurnResuscitation(bsaPercent, weightKg) {
  if (!bsaPercent || !weightKg) return null;
  const parkland = bsaPercent * weightKg * 4;
  const halfIn24h = parkland / 2;
  const firstHourRate = halfIn24h / 8;
  return {
    parkland: parkland.toFixed(0),
    firstHour: firstHourRate.toFixed(0),
    nextHours: (parkland / 2 / 16).toFixed(0),
    formula: "4 mL × %BSA × weight (kg)",
  };
}

function calculateShortBowelAnatomy(remainingLength, ageYears) {
  if (!remainingLength || !ageYears) return null;
  const expectedByAge = {
    infant: 300,
    toddler: 400,
    child: 600,
    adolescent: 700,
  };
  let expected = expectedByAge.child;
  if (ageYears < 1) expected = expectedByAge.infant;
  else if (ageYears < 3) expected = expectedByAge.toddler;
  else if (ageYears >= 12) expected = expectedByAge.adolescent;
  const percent = (remainingLength / expected * 100).toFixed(0);
  return {
    remaining: remainingLength,
    expected: expected,
    percent: percent,
    prognosis: percent < 30 ? "Likely TPN dependent" : percent < 50 ? "May achieve autonomy" : "Good prognosis",
  };
}

function calculatePELDScore(bili, inr, albumin, ageMonths) {
  if (!bili || !inr || !albumin) return null;
  const peld = 0.480 * Math.log(bili) + 1.857 * Math.log(inr) - 0.687 * Math.log(albumin) + (ageMonths < 12 ? 0.667 * Math.log(Math.max(800 - (100 * (ageMonths / 12)), 100)) / Math.log(10) : 0);
  return {
    score: Math.round(peld),
    bili: bili,
    inr: inr,
    albumin: albumin,
  };
}

function Settings({onHome,settings,onSettingsChange}) {
  const handleToggle = (path, value) => {
    const newSettings = JSON.parse(JSON.stringify(settings));
    const keys = path.split('.');
    let obj = newSettings;
    for (let i = 0; i < keys.length - 1; i++) {
      obj = obj[keys[i]];
    }
    obj[keys[keys.length - 1]] = value;
    onSettingsChange(newSettings);
  };

  const handleSelectAll = (section) => {
    const newSettings = JSON.parse(JSON.stringify(settings));
    const sectionObj = newSettings[section];
    Object.keys(sectionObj).forEach(key => {
      sectionObj[key] = true;
    });
    onSettingsChange(newSettings);
  };

  const handleDeselectAll = (section) => {
    const newSettings = JSON.parse(JSON.stringify(settings));
    const sectionObj = newSettings[section];
    Object.keys(sectionObj).forEach(key => {
      sectionObj[key] = false;
    });
    onSettingsChange(newSettings);
  };

  const handleRestoreDefaults = () => {
    if (window.confirm("Restore all settings to defaults?")) {
      onSettingsChange(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)));
    }
  };

  const renderToggleSection = (title, section, items) => {
    const sectionSettings = settings[section] || {};
    return (
      <div key={section} style={{marginBottom:20}}>
        <div style={C.lbl}>{title}</div>
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          <button onClick={() => handleSelectAll(section)} style={{flex:1,...C.btnS,marginBottom:0,fontSize:11,padding:"8px 10px"}}>Select All</button>
          <button onClick={() => handleDeselectAll(section)} style={{flex:1,...C.btnS,marginBottom:0,fontSize:11,padding:"8px 10px"}}>Deselect All</button>
        </div>
        {items.map(item => (
          <div key={item.key} style={C.toggle(sectionSettings[item.key])} onClick={() => handleToggle(`${section}.${item.key}`, !sectionSettings[item.key])}>
            <span style={C.toggleLabel}>{item.label}</span>
            <div style={C.toggleSwitch(sectionSettings[item.key])}>
              <div style={{width:20,height:20,borderRadius:11,background:sectionSettings[item.key]?"#fff":"transparent"}}/>
            </div>
          </div>
        ))}
      </div>
    );
  };

  return (
    <div>
      <button style={C.back()} onClick={onHome}>← Home</button>
      <div style={{fontSize:24,fontWeight:800,marginBottom:2}}>⚙️ Settings</div>
      <div style={{fontSize:13,color:"#607090",marginBottom:14}}>Customize which sections and content you see</div>

      {renderToggleSection("App Tabs", "tabs", [
        {key:"nat",label:"APSA NaT"},
        {key:"videos",label:"Surgery Videos"},
        {key:"podcasts",label:"Podcasts"},
        {key:"research",label:"Research"},
        {key:"societies",label:"Societies"},
        {key:"social",label:"Social Media"},
        {key:"ai",label:"Virtual Pedi Surgeon"},
        {key:"clinicalTools",label:"Clinical Tools"},
      ])}

      {renderToggleSection("Nutrition & Fluids", "clinicalTools", [
        {key:"Fluids / I·O",label:"Fluids / I·O"},
        {key:"Enteral Feeding",label:"Enteral Feeding"},
        {key:"Maintenance IV Fluid",label:"Maintenance IV Fluid"},
        {key:"Blood Volume & Blood Loss",label:"Blood Volume & Blood Loss"},
      ])}

      {renderToggleSection("Medications & Anesthesia", "clinicalTools", [
        {key:"Local Anesthetic Maximum",label:"Local Anesthetic Maximum"},
      ])}

      {renderToggleSection("Vital Signs & Assessment", "clinicalTools", [
        {key:"Shock Index, Age-Adjusted",label:"Shock Index, Age-Adjusted"},
        {key:"Vital Signs by Age",label:"Vital Signs by Age"},
        {key:"Airway & Tube Sizes",label:"Airway & Tube Sizes"},
      ])}

      {renderToggleSection("Appendicitis Risk Scores", "clinicalTools", [
        {key:"Pediatric Appendicitis Score",label:"Pediatric Appendicitis Score"},
        {key:"Alvarado Score",label:"Alvarado Score"},
        {key:"pARC — Appendicitis Risk",label:"pARC — Appendicitis Risk"},
      ])}

      {renderToggleSection("Specialty Calculations", "clinicalTools", [
        {key:"Burn Resuscitation",label:"Burn Resuscitation"},
        {key:"Short Bowel Anatomy",label:"Short Bowel Anatomy"},
        {key:"PELD Score",label:"PELD Score"},
      ])}

      <button onClick={handleRestoreDefaults} style={{...C.btnS,background:"rgba(255,80,80,0.1)",border:"1px solid rgba(255,80,80,0.25)",color:"#ff9090",marginTop:8}}>🔄 Restore Default Settings</button>
    </div>
  );
}

function App() {
  const [tab,setTab] = useState("home");
  const [settings,setSettings] = useState(() => {
    const saved = localStorage.getItem("pedisurgpro_settings");
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  });

  useEffect(() => {
    localStorage.setItem("pedisurgpro_settings", JSON.stringify(settings));
  }, [settings]);

  const pageRef = useRef(null);
  useEffect(()=>{ if(pageRef.current) pageRef.current.scrollTop = 0; }, [tab]);
  
  const baseNav = [
    {id:"home",ic:"⚕️",lb:"Home"},
    ...(settings.tabs.nat ? [{id:"nat",ic:"📖",lb:"NaT"}] : []),
    ...(settings.tabs.videos ? [{id:"videos",ic:"▶️",lb:"Videos"}] : []),
    ...(settings.tabs.podcasts ? [{id:"podcasts",ic:"🎙️",lb:"Podcasts"}] : []),
    ...(settings.tabs.research ? [{id:"research",ic:"🔬",lb:"Research"}] : []),
    ...(settings.tabs.societies ? [{id:"societies",ic:"🏛️",lb:"Societies"}] : []),
    ...(settings.tabs.social ? [{id:"social",ic:"📱",lb:"Social"}] : []),
    ...(settings.tabs.ai ? [{id:"ai",ic:"✦",lb:"Virt Surg"}] : []),
    ...(settings.tabs.clinicalTools ? [{id:"clinicalTools",ic:"🧮",lb:"Tools"}] : []),
    {id:"settings",ic:"⚙️",lb:"Settings"},
  ];

  return (
    <div style={C.app}>
      <div style={C.page} ref={pageRef}>
        {tab==="home"     && <Home onNav={setTab} settings={settings}/>}
        {tab==="nat"      && <Nat onHome={()=>setTab("home")} scrollTop={()=>pageRef.current&&(pageRef.current.scrollTop=0)} settings={settings}/>}
        {tab==="videos"   && <Videos onHome={()=>setTab("home")} scrollTop={()=>pageRef.current&&(pageRef.current.scrollTop=0)} settings={settings}/>}
        {tab==="podcasts" && <Podcasts onHome={()=>setTab("home")} scrollTop={()=>pageRef.current&&(pageRef.current.scrollTop=0)} settings={settings}/>}
        {tab==="research" && <Research onHome={()=>setTab("home")} scrollTop={()=>pageRef.current&&(pageRef.current.scrollTop=0)}/>}
        {tab==="societies" && <Societies onHome={()=>setTab("home")} settings={settings}/>}
        {tab==="social"   && <SocialMedia onHome={()=>setTab("home")} settings={settings}/>}
        {tab==="ai"       && <AI onHome={()=>setTab("home")} onNav={setTab}/>}
        {tab==="clinicalTools" && <ClinicalTools onHome={()=>setTab("home")} settings={settings}/>}
        {tab==="settings" && <Settings onHome={()=>setTab("home")} settings={settings} onSettingsChange={setSettings}/>}
      </div>
      <div style={C.nav}>
        {baseNav.map(x=>(
          <button key={x.id} style={C.nb(tab===x.id)} onClick={()=>setTab(x.id)}>
            <span style={{fontSize:18}}>{x.ic}</span>
            <span style={{fontSize:9,fontWeight:700}}>{x.lb}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
